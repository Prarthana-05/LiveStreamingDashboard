<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Stream</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Live Streaming Dashboard
        </span>

        <a href="/" class="btn btn-secondary">
            Back Dashboard
        </a>

    </div>

</nav>




<div class="container mt-5">


    <div class="card shadow">


        <div class="card-body">


            <h2 class="mb-4">
                Add New Stream
            </h2>



            <form action="/add-stream" method="post">



                <div class="mb-3">

                    <label class="form-label">
                        Stream Name
                    </label>

                    <input
                            type="text"
                            name="streamName"
                            class="form-control"
                            placeholder="Enter stream name">

                </div>




                <div class="mb-3">

                    <label class="form-label">
                        Channel Name
                    </label>

                    <input
                            type="text"
                            name="channelName"
                            class="form-control"
                            placeholder="Enter channel name">

                </div>





                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status" class="form-control">

                        <option value="online">
                            Online
                        </option>

                        <option value="offline">
                            Offline
                        </option>

                    </select>

                </div>





                <div class="mb-3">

                    <label class="form-label">
                        Quality
                    </label>

                    <select name="quality" class="form-control">

                        <option value="HD">
                            HD
                        </option>

                        <option value="Full HD">
                            Full HD
                        </option>

                        <option value="4K">
                            4K
                        </option>

                    </select>

                </div>





                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Enter location">

                </div>





                <button type="submit" class="btn btn-success">

                    Add Stream

                </button>



            </form>


        </div>


    </div>


</div>



</body>

</html>
