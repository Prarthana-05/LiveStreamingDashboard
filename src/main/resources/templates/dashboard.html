<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Live Streaming Dashboard MVP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Live Streaming Dashboard
        </span>

        <a th:href="@{/add}" class="btn btn-success">
            Add Stream
        </a>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4">
        Dashboard Overview
    </h2>

    <div class="row">

        <div class="col-md-4">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Total Streams</h5>

                    <h2 th:text="${total}">
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Online Streams</h5>

                    <h2 th:text="${online}">
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center shadow">

                <div class="card-body">

                    <h5>Offline Streams</h5>

                    <h2 th:text="${offline}">
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <hr>

    <h3>
        Search Stream
    </h3>

    <form th:action="@{/search}" method="get" class="d-flex mb-3">

        <input
                class="form-control me-2"
                type="text"
                name="name"
                placeholder="Enter stream name">

        <button type="submit" class="btn btn-primary">
            Search
        </button>

    </form>

    <h3>
        Filter Status
    </h3>

    <a th:href="@{/status(value='online')}"
       class="btn btn-success">
        Online
    </a>

    <a th:href="@{/status(value='offline')}"
       class="btn btn-danger">
        Offline
    </a>

    <a th:href="@{/}"
       class="btn btn-secondary">
        All
    </a>

    <h3 class="mt-4">
        Alerts
    </h3>

    <div th:each="stream : ${streams}">

        <div th:if="${stream.status == 'offline'}"
             class="alert alert-danger">

            ⚠
            <span th:text="${stream.streamName}">
            </span>

            is offline

        </div>

    </div>

    <h3>
        Stream Details
    </h3>

    <table class="table table-bordered table-striped">

        <tr class="table-dark">

            <th>ID</th>
            <th>Stream Name</th>
            <th>Channel</th>
            <th>Status</th>
            <th>Quality</th>
            <th>Location</th>

        </tr>

        <tr th:each="stream : ${streams}">

            <td th:text="${stream.id}">
            </td>

            <td th:text="${stream.streamName}">
            </td>

            <td th:text="${stream.channelName}">
            </td>

            <td th:text="${stream.status}">
            </td>

            <td th:text="${stream.quality}">
            </td>

            <td th:text="${stream.location}">
            </td>

        </tr>

    </table>

</div>

</body>

</html>
